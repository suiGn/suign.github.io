:root {
  --background: #0b0b0a;
  --surface: #111110;
  --text: #e9e6df;
  --muted: #a39f95;
  --faint: #6f6c63;
  --line: #292824;
  --accent: #d6cfbd;
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --background: #0b0b0a;
    --surface: #111110;
    --text: #e9e6df;
    --muted: #a39f95;
    --faint: #6f6c63;
    --line: #292824;
    --accent: #d6cfbd;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--background);
  color: var(--text);
}

body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: Georgia, "Times New Roman", Times, serif;
  -webkit-font-smoothing: antialiased;
}

.shell {
  min-height: 100vh;
  width: 100%;
  padding-top: var(--safe-area-inset-top);
  background: var(--background);
  overflow-x: clip;
}

.column {
  width: min(100% - 40px, 720px);
  margin: 0 auto;
  padding: 76px 0 64px;
}

.masthead {
  padding-bottom: 42px;
}

.eyebrow {
  margin: 0 0 28px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size: 11px;
  line-height: 1.5;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}

h1 {
  margin: 0;
  font-weight: 400;
  font-size: clamp(42px, 8vw, 64px);
  line-height: 0.98;
  letter-spacing: -0.035em;
  color: var(--text);
}

h1 span {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-style: italic;
  font-weight: 400;
}

.subheader {
  margin: 38px 0 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size: 12px;
  line-height: 1.8;
  letter-spacing: 0.04em;
  color: var(--accent);
}

.note {
  margin: 18px 0 0;
  max-width: 560px;
  font-size: 16px;
  line-height: 1.65;
  color: var(--muted);
  font-style: italic;
}

.rule {
  height: 1px;
  background: var(--line);
}

.section {
  padding: 46px 0 44px;
  border-bottom: 1px solid var(--line);
}

.section-head {
  display: flex;
  align-items: baseline;
  gap: 18px;
  margin-bottom: 28px;
}

.section-no {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--faint);
}

h2 {
  margin: 0;
  font-size: 26px;
  line-height: 1.15;
  font-weight: 400;
  letter-spacing: -0.02em;
}

.section-body p {
  margin: 0 0 18px;
  font-size: 17.5px;
  line-height: 1.78;
  color: #d8d4cb;
}

.section-body p:last-child {
  margin-bottom: 0;
}

.section-body .lead {
  font-size: 20px;
  line-height: 1.55;
  color: var(--text);
}

footer {
  padding-top: 48px;
}

.footer-rule {
  height: 1px;
  background: var(--accent);
  margin-bottom: 30px;
  opacity: 0.45;
}

.r0 {
  margin: 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text);
}

.r0 span {
  color: var(--muted);
  letter-spacing: 0.08em;
}

.footer-text {
  margin: 16px 0 0;
  max-width: 620px;
  font-size: 16px;
  line-height: 1.7;
  color: var(--muted);
}

.links {
  margin-top: 34px;
  padding: 20px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.links p {
  margin: 0 0 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size: 12px;
  line-height: 1.7;
  word-break: break-all;
  color: var(--muted);
}

.links p:last-child {
  margin-bottom: 0;
}

.link-label {
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 10px;
}

.colophon {
  margin: 28px 0 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size: 10px;
  line-height: 1.6;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--faint);
}

@media (max-width: 520px) {
  .column {
    width: min(100% - 32px, 720px);
    padding: 52px 0 48px;
  }

  .masthead {
    padding-bottom: 34px;
  }

  h1 {
    font-size: 42px;
  }

  h2 {
    font-size: 23px;
  }

  .section {
    padding: 38px 0 36px;
  }

  .section-body p {
    font-size: 16.5px;
    line-height: 1.72;
  }

  .subheader {
    font-size: 11px;
  }
}
